function spark(v){if(v.length<2)return '<span class="small">1 session</span>';var mx=Math.max.apply(null,v),mn=Math.min.apply(null,v);var r=mx-mn||1;return '<svg viewBox="0 0 80 28" width="80" height="28"><polyline fill="none" stroke="#e23636" stroke-width="2.5" points="'+v.map(function(x,i){return (i/(v.length-1)*76+2).toFixed(1)+','+(26-(x-mn)/r*24).toFixed(1);}).join(' ')+'"/></svg>';}
function drawChart(){var sv=$("#chart");if(!sv)return;var bw=S.bw.slice().sort(function(a,b){return a.d<b.d?-1:1;});var W=340,H=170,L=34,R=8,T=10,B=22;
 var ws=bw.map(function(b){return b.w;});var lo=Math.min.apply(null,ws.concat([172])),hi=Math.max.apply(null,ws.concat([198]));lo=Math.floor(lo/5)*5;hi=Math.ceil(hi/5)*5;
 var t0=bw.length?pd(bw[0].d).getTime():Date.now();var t1=bw.length?pd(bw[bw.length-1].d).getTime():t0;if(t1-t0<14*864e5)t1=t0+14*864e5;
 function X(t){return L+(t-t0)/(t1-t0)*(W-L-R);}function Y(w){return T+(hi-w)/(hi-lo)*(H-T-B);}
 var g='<rect x="'+L+'" y="'+Y(180)+'" width="'+(W-L-R)+'" height="'+(Y(175)-Y(180))+'" fill="rgba(46,160,90,.25)"/><text x="'+(W-R-4)+'" y="'+(Y(180)-4)+'" fill="#5fd38d" font-size="10" text-anchor="end">GOAL 175–180</text>';
 for(var w=lo;w<=hi;w+=5){g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(w)+'" y2="'+Y(w)+'" stroke="#223" stroke-width="1"/><text x="'+(L-5)+'" y="'+(Y(w)+3)+'" fill="#8890a8" font-size="9" text-anchor="end">'+w+'</text>';}
 if(bw.length){var pts=bw.map(function(b){return X(pd(b.d).getTime()).toFixed(1)+','+Y(b.w).toFixed(1);});g+='<polyline fill="none" stroke="#e23636" stroke-width="3" points="'+pts.join(' ')+'"/>';bw.forEach(function(b){g+='<circle cx="'+X(pd(b.d).getTime())+'" cy="'+Y(b.w)+'" r="4" fill="#fff" stroke="#e23636" stroke-width="2"/>';});
  g+='<text x="'+L+'" y="'+(H-6)+'" fill="#8890a8" font-size="9">'+fmtDate(bw[0].d)+'</text><text x="'+(W-R)+'" y="'+(H-6)+'" fill="#8890a8" font-size="9" text-anchor="end">'+fmtDate(ds(new Date(t1)))+'</text>';}
 sv.innerHTML=g;}

 var h='<div class="mjump">'+[["menu","Today"],["grocery","Grocery"],["prep","Prep"],["eatout","Eat out"],["hydrate","Hydration"],["scale","Scale"]].map(function(u){return '<button class="'+((view.mealsSec||"menu")===u[0]?'on':'')+'" onclick="setMealsSec(\''+u[0]+'\')">'+u[1]+'</button>';}).join('')+'</div>';
