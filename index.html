<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d17"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>Spidey Gym · Jacob's Workout</title>
<style>
:root{--bg:#0b0d17;--card:#141828;--card2:#1b2034;--line:#262c45;--red:#e23636;--red2:#b81f2a;--blue:#2f6bff;--blue2:#1b3fa8;--txt:#eef1fa;--mut:#8f97b3;--ok:#2ea05a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,13,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .logo{width:34px;height:34px;border-radius:10px;background:radial-gradient(circle at 30% 30%,#ff5a5a,var(--red2));display:grid;place-items:center;font-size:19px;box-shadow:0 0 0 2px var(--blue2)}
header h1{font-size:17px;margin:0;letter-spacing:.5px}header small{display:block;color:var(--mut);font-size:11px;font-weight:500}
main{padding:12px 14px;max-width:560px;margin:0 auto}
.strip{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chip{flex:1 0 46px;min-height:58px;border:1px solid var(--line);background:var(--card);color:var(--mut);border-radius:12px;padding:6px 2px;position:relative;font:inherit}
.chip b{display:block;font-size:12px;color:var(--txt)}.chip span{font-size:9.5px;font-weight:700;letter-spacing:.3px}
.chip.today{border-color:var(--blue)}.chip.on{background:linear-gradient(160deg,var(--red),var(--red2));color:#fff;border-color:var(--red)}.chip.on b{color:#fff}
.chip i{position:absolute;top:2px;right:5px;font-style:normal;font-size:10px;color:var(--ok)}.chip.on i{color:#fff}
.hero{border-radius:20px;padding:18px;margin:2px 0 12px;background:linear-gradient(150deg,#2a0c14 0%,#5e1220 45%,#102a6b 100%);position:relative;overflow:hidden;border:1px solid #3a1a2a}
.hero:before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 110% -10%,transparent 0 22px,rgba(255,255,255,.05) 23px 24px),repeating-conic-gradient(from 0deg at 110% -10%,transparent 0 9deg,rgba(255,255,255,.05) 9deg 9.6deg);pointer-events:none}
.hero>*{position:relative}.hero.slim{padding:16px 18px}.hero.rest{background:linear-gradient(150deg,#0f1838,#16306f)}
.kicker{font-size:11px;font-weight:800;letter-spacing:1.4px;color:#ffb3b3}.hero.rest .kicker{color:#a9c2ff}
.hero h1{margin:4px 0 2px;font-size:34px;line-height:1.05;letter-spacing:-.5px;font-weight:900;text-transform:uppercase}
.tag{color:#d9ddef;font-size:14px}.hero p{color:#dfe4f5;font-size:15px}.hero .tip{color:#a9c2ff;font-size:14px}
.stats{display:flex;gap:8px;margin:14px 0 10px}.stats div{flex:1;background:rgba(0,0,0,.28);border-radius:12px;padding:8px 6px;text-align:center}
.stats b{display:block;font-size:22px;font-weight:900}.stats span{font-size:11px;color:#c8cde2}.stats.one div{flex:0 0 auto;padding:8px 16px}
.estline{font-size:13px;color:#dfe4f5;margin:-2px 0 10px}
.big{display:block;width:100%;min-height:56px;border:0;border-radius:14px;font:800 17px/1 sans-serif;font-family:inherit;color:#fff;margin:8px 0;cursor:pointer;text-align:center;text-decoration:none;padding:19px 10px}
.big.red{background:linear-gradient(180deg,#f04444,var(--red2));box-shadow:0 6px 20px rgba(226,54,54,.35)}.big.blue{background:linear-gradient(180deg,#3d78ff,var(--blue2));box-shadow:0 6px 20px rgba(47,107,255,.3)}
.big.yt{background:#c4302b}
.ghost{display:block;width:100%;min-height:48px;background:rgba(255,255,255,.06);color:var(--txt);border:1px solid var(--line);border-radius:12px;font:600 14px sans-serif;font-family:inherit;margin:6px 0;padding:12px;cursor:pointer;text-align:center}
.ghost.danger{color:#ff8a8a;border-color:#4a2230}.filebtn input{display:none}
.note{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:12px;padding:10px 12px;font-size:13.5px;margin:0 0 12px;color:#cfd5ea}
.note.crohn{border-left-color:#5fd38d}.note.warn{border-left-color:#f5b041}.note a{color:#9db8ff}
.small{font-size:12px;color:var(--mut);margin-top:6px}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:18px 2px 8px}.sec span{font-weight:900;font-size:13px;letter-spacing:1.5px;color:var(--red)}.sec em{font-style:normal;font-size:11.5px;color:var(--mut);text-align:right}
.sec.abs span{color:#6f9bff}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin:0 0 10px}.card.plain{font-size:14.5px;color:#d5daec}
.card.ex.complete{border-color:#2a6b45;background:linear-gradient(180deg,#14261d,var(--card))}
.exhead{display:flex;gap:12px;align-items:center;cursor:pointer}
.thumb{width:92px;height:66px;border-radius:10px;overflow:hidden;position:relative;flex:none;background:#fff}
.thumb img,.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.thumb img.b,.demo img.b{animation:flip 2.4s infinite steps(1)}
@keyframes flip{0%{opacity:0}50%{opacity:1}}
.exinfo{flex:1;min-width:0}.num{font-size:11px;font-weight:800;color:var(--red);letter-spacing:1px}.exinfo h3{margin:1px 0 2px;font-size:16.5px;line-height:1.2}
.rx{font-size:13px;color:var(--mut)}.rx.big{font-size:15px;color:#cfd6ee;margin:-4px 0 10px;min-height:0;padding:0}
.more{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--card2);color:#9db8ff;font-size:18px;flex:none}
.last{font-size:12.5px;color:#a9b3d4;margin-top:9px}.sug{font-size:12.5px;color:#ffd38a;margin-top:6px}
.sets{margin-top:10px}.sh,.setrow{display:grid;grid-template-columns:34px 1fr 1fr 56px;gap:8px;align-items:center}
.sh{font-size:10.5px;color:var(--mut);font-weight:800;letter-spacing:1px;padding:0 2px 4px}
.setrow{margin:6px 0}.sn{width:34px;height:34px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:14px}
.setrow input{width:100%;min-width:0;height:48px;border-radius:12px;border:1px solid var(--line);background:#0e1120;color:#fff;font:700 19px sans-serif;font-family:inherit;text-align:center}
.setrow input::placeholder{color:#5d6584}
.tick{height:48px;border-radius:12px;border:2px solid #3a4266;background:transparent;color:#fff;font-size:22px;font-weight:900;cursor:pointer}.tick.wide{width:auto;padding:0 18px;background:var(--blue);border:0;font-size:15px}
.setrow.done .tick{background:var(--ok);border-color:var(--ok)}.setrow.done .sn{background:var(--ok)}.setrow.done input{border-color:#2a6b45;color:#bfe9cf}
.finrow{display:flex;gap:12px;align-items:center}.finrow input{width:26px;height:26px;accent-color:var(--ok);flex:none}
.foot{font-size:12px;color:var(--mut);text-align:center;margin:18px 6px 8px}
.live{background:rgba(0,0,0,.3);border-radius:14px;padding:10px}.lrow{display:flex;gap:6px}.lrow div{flex:1;text-align:center}.lrow b{display:block;font-size:19px;font-weight:900}.lrow span{font-size:10.5px;color:#c8cde2}
b.late{color:#ffb36b}b.early{color:#7ee2a3}.bar{height:8px;background:rgba(255,255,255,.12);border-radius:8px;margin:10px 0 4px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),#ff7a7a);border-radius:8px;transition:width .3s}
.lsm{font-size:11.5px;color:#c8cde2;text-align:center}
.dcard{display:flex;align-items:center;gap:12px;cursor:pointer}.dw{width:46px;height:46px;border-radius:12px;background:var(--card2);display:grid;place-items:center;font-weight:900;font-size:12px;color:var(--red)}
.dm{flex:1;min-width:0}.dm h3{margin:0;font-size:16px}.dt{font-weight:800;color:#9db8ff;font-size:14px;white-space:nowrap}
.srow,.hrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.srow span,.hrow span{display:block;font-size:12.5px;color:var(--mut)}.r{text-align:right;font-size:14px;font-weight:700}
.bwtop{display:flex;justify-content:space-between;align-items:baseline;font-size:14px;color:var(--mut)}.bwtop b{font-size:26px;color:#fff}
#chart{width:100%;height:auto;margin:6px 0}.bwin{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.bwin input{height:48px;border-radius:12px;border:1px solid var(--line);background:#0e1120;color:#fff;font:600 15px sans-serif;font-family:inherit;padding:0 10px;min-width:0}
.bwlist{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--mut);margin-top:10px}.bwlist a{color:#ff8a8a;text-decoration:none;padding:0 4px}
.set b{display:block;margin-bottom:8px}.seg{display:flex;gap:6px}.seg button{flex:1;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font:700 14px sans-serif;font-family:inherit}.seg button.on{background:var(--red);border-color:var(--red)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:rgba(14,17,32,.97);border-top:1px solid var(--line);padding-bottom:calc(34px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;height:66px;background:none;border:0;color:var(--mut);font:700 11px sans-serif;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tabbar button i{font-style:normal;font-size:22px}.tabbar button.on{color:#fff}.tabbar button.on i{filter:drop-shadow(0 0 6px var(--red))}
#rest{position:fixed;left:10px;right:10px;bottom:calc(110px + env(safe-area-inset-bottom));z-index:40;background:linear-gradient(150deg,#1b3fa8,#0f1e57);border:1px solid #3d5fd0;border-radius:18px;padding:12px 14px;display:none;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#rest.on{display:block}#resthead{font-size:12px;font-weight:900;letter-spacing:2px;color:#cdd8ff}
#rest.soon{background:linear-gradient(150deg,#b8860b,#6b4a05);border-color:#f5b041}
#rest.go{background:linear-gradient(150deg,#e23636,#8a121c);border-color:#ff7a7a;animation:pulse 1s infinite}#rest.go #resthead{font-size:30px;color:#fff;letter-spacing:1px}
#rest.go.late{animation:pulse .5s infinite}#restover{font-weight:900;color:#fff;font-size:15px;margin-top:4px}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,90,90,.35),0 10px 30px rgba(0,0,0,.5)}}
.exctl{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}.exctl em{font-style:normal;color:var(--mut);font-size:12px}
.mini{min-height:44px;padding:0 14px;border-radius:12px;border:1px solid var(--line);background:var(--card2);color:#fff;font:800 14px sans-serif;font-family:inherit}
.mini.go{background:var(--blue);border-color:var(--blue)}.mini.fin{background:#2a6b45;border-color:#2a6b45}
.exrun b{font-size:20px;font-variant-numeric:tabular-nums;color:#fff}.exrun{color:#9db8ff;flex:1}.exdone{color:#7ee2a3;font-weight:700;flex:1;font-size:14px}.exest{color:var(--mut);font-size:12.5px}body.resting{padding-bottom:320px}.rtop{display:flex;align-items:center;gap:10px}#resttime{font-size:64px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;min-width:96px}
#restlbl{flex:1;font-size:13px;color:#cdd8ff}.rbtns{display:flex;gap:6px;margin-top:8px}.rbtns button{flex:1;height:44px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font:800 15px sans-serif;font-family:inherit}
.rbar{height:6px;background:rgba(255,255,255,.15);border-radius:6px;overflow:hidden;margin-top:8px}#restbar{height:100%;background:#fff;width:100%}
#modal{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.65);display:none;align-items:flex-end}#modal.on{display:flex}
.sheet{background:var(--bg);border-top:2px solid var(--red);border-radius:22px 22px 0 0;width:100%;max-height:92vh;overflow-y:auto;padding:14px 16px calc(20px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}
.demo{position:relative;width:100%;aspect-ratio:3/2;border-radius:14px;overflow:hidden;background:#fff}.demolbl{position:absolute;left:8px;bottom:8px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;font-weight:800;padding:4px 8px;border-radius:8px;letter-spacing:.5px}
.detail h2{margin:12px 0 6px;font-size:23px}.detail h4{margin:14px 0 6px;font-size:12px;letter-spacing:1.4px;color:var(--red);text-transform:uppercase}
.eq{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;font-size:14px;color:#d5daec}
.cues,.bad{margin:0;padding-left:0;list-style:none}.cues li,.bad li{padding:6px 0 6px 28px;position:relative;font-size:15px}.cues li:before{content:"✓";position:absolute;left:4px;color:#5fd38d;font-weight:900}.bad li:before{content:"✕";position:absolute;left:5px;color:#ff6b6b;font-weight:900}
.hist div{display:flex;justify-content:space-between;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)}.hist span{color:var(--mut)}
.credit{font-size:11px;color:var(--mut);text-align:center;margin-top:8px}
.done-modal{text-align:center}.done-modal .big-emoji{font-size:52px}.done-modal h2{margin:4px 0}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top));transform:translateX(-50%) translateY(-20px);background:#fff;color:#111;font-weight:700;font-size:14px;padding:10px 16px;border-radius:24px;opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style></head><body>
<header><div class="logo">🕷️</div><div><h1>SPIDEY GYM</h1><small>Jacob · Onelife Fitness · 4-day split</small></div></header>
<main id="main"></main>
<div id="rest"><div id="resthead">REST</div><div class="rtop"><div id="resttime">1:30</div><div id="restlbl">Rest</div></div><div id="restover"></div><div class="rbar"><div id="restbar"></div></div><div class="rbtns"><button onclick="addRest(-15)">−15s</button><button onclick="addRest(15)">+15s</button><button onclick="stopRest()">Skip / Going ▶</button></div></div>

<script>
var EX={
assist_pullup:{name:"Assisted Pull-Up (or Lat Pulldown)",img:"Pullups",equip:"Assisted pull-up/dip machine (kneel on the pad). More weight on the stack means more help. If it’s taken, use the lat pulldown.",cues:["Grip overhand, a bit wider than shoulders","Pull your chest toward the bar, elbows drive down","Squeeze your shoulder blades at the top","Lower all the way down, slow (2–3 sec)"],mistakes:["Half reps (not straightening the arms at the bottom)","Swinging or kicking","Shrugging shoulders up to the ears"],yt:"assisted pull up machine form"},
lat_pulldown:{name:"Wide-Grip Lat Pulldown",img:"Wide-Grip_Lat_Pulldown",equip:"Lat pulldown station (cable). Lock your thighs under the pad.",cues:["Grip wider than shoulders, sit tall","Pull the bar to your upper chest","Drive elbows down and back","Let the bar rise with control"],mistakes:["Leaning way back to yank the weight","Pulling behind the neck","Letting the stack slam"],yt:"wide grip lat pulldown form"},
chest_press:{name:"Chest Press Machine",img:"Leverage_Chest_Press",equip:"Seated chest press machine (pin-select weight stack). Set the seat so the handles line up with mid-chest.",cues:["Back flat against the pad","Handles at mid-chest height","Press until arms are almost straight","Return slowly, don't let the stack touch"],mistakes:["Seat too low or high (shoulder strain)","Locking elbows hard","Arching off the pad"],yt:"chest press machine form"},
seated_row:{name:"Seated Row (Machine or Cable)",img:"Seated_Cable_Rows",equip:"Seated cable row with a V-handle, or the seated row machine with a chest pad.",cues:["Sit tall, knees slightly bent","Pull the handle to your stomach","Squeeze shoulder blades together","Arms stretch forward with control"],mistakes:["Rocking your torso to move the weight","Rounding your lower back","Shrugging"],yt:"seated cable row form"},
shoulder_press_m:{name:"Shoulder Press Machine",img:"Leverage_Shoulder_Press",equip:"Seated shoulder press machine (pin-select stack). Handles start around ear height.",cues:["Back against the pad, core tight","Handles at about ear height","Press up until arms are almost straight","Lower slowly"],mistakes:["Arching your lower back","Shrugging your shoulders","Going too heavy too soon"],yt:"shoulder press machine form"},
lat_raise:{name:"Dumbbell Lateral Raise",img:"Side_Lateral_Raise",equip:"Light dumbbells from the rack (start 10–15 lb). This is the V-taper builder.",cues:["Slight bend in the elbows","Raise out to the sides to shoulder height","Lead with the elbows, pinkies slightly up","Lower slowly (2 sec)"],mistakes:["Swinging the weight up","Shrugging traps","Going above shoulder height"],yt:"dumbbell lateral raise form"},
pushdown:{name:"Cable Triceps Pushdown (Rope)",img:"Triceps_Pushdown_-_Rope_Attachment",equip:"Cable station, high pulley, rope attachment.",cues:["Elbows pinned at your sides","Push down until arms are straight","Spread the rope at the bottom, squeeze","Let it back up slowly"],mistakes:["Elbows drifting forward","Leaning over to use bodyweight","Rushing the way up"],yt:"rope triceps pushdown form"},
db_curl:{name:"Dumbbell Curl",img:"Dumbbell_Bicep_Curl",equip:"Dumbbell rack. Both arms or alternate.",cues:["Stand tall, palms forward","Elbows stay close to your sides","Curl up without swinging, squeeze","Lower all the way down slowly"],mistakes:["Swinging with your back","Elbows moving forward","Half reps"],yt:"dumbbell bicep curl form"},
captain_chair:{name:"Captain's Chair Knee Raise",img:"Knee_Hip_Raise_On_Parallel_Bars",equip:"Captain's chair / vertical knee raise station (back pad + arm rests).",cues:["Back pressed into the pad, forearms on the rests","Raise knees toward your chest","Curl your hips up a little at the top","Lower slowly, no swinging"],mistakes:["Swinging the legs for momentum","Arching your back off the pad","Dropping the legs fast"],yt:"captains chair knee raise form"},
ab_machine:{name:"Ab Crunch Machine",img:"Ab_Crunch_Machine",equip:"Seated ab crunch machine (pin-select stack). Start light.",cues:["Feet hooked, hands on the handles","Crunch by curling your ribs toward hips","Exhale hard as you crunch","Return slowly, don't let the stack drop"],mistakes:["Pulling with the arms","Going too heavy and jerking","Using hip flexors instead of abs"],yt:"ab crunch machine form"},
plank:{name:"Plank",img:"Plank",equip:"Floor / stretch mat area.",cues:["Elbows under shoulders","Straight line head to heels","Squeeze glutes and brace abs","Breathe steadily"],mistakes:["Hips sagging","Butt sticking up","Holding your breath"],yt:"plank proper form"},
leg_press:{name:"Leg Press",img:"Leg_Press",equip:"Leg press: the seated pin-select machine or a plate-loaded 45° sled, whichever your gym has. Start light.",cues:["Feet shoulder-width, mid-platform","Lower until knees are about 90°","Push through your heels","Don't lock knees at the top"],mistakes:["Lower back lifting off the pad","Knees caving in","Locking out knees hard"],yt:"leg press form beginner"},
db_rdl:{name:"Dumbbell Romanian Deadlift",img:"Stiff-Legged_Dumbbell_Deadlift",equip:"Pair of dumbbells. Light to start; feel the hamstrings.",cues:["Soft knees, flat back","Push your hips back, dumbbells slide down thighs","Stop at mid-shin or when hamstrings stretch","Squeeze glutes to stand up"],mistakes:["Rounding the back","Squatting instead of hinging","Going too low"],yt:"dumbbell romanian deadlift form"},
lunge:{name:"Walking Lunge (Bodyweight)",img:"Bodyweight_Walking_Lunge",equip:"Open floor or turf. Bodyweight first; hold light dumbbells later.",cues:["Long step forward, torso tall","Back knee drops toward the floor","Front knee tracks over toes","Push through the front heel to step through"],mistakes:["Front knee caving in","Short choppy steps","Leaning forward"],yt:"walking lunge form"},
leg_curl:{name:"Seated Leg Curl",img:"Seated_Leg_Curl",equip:"Seated leg curl machine (or lying leg curl if that one’s open).",cues:["Knees line up with the machine pivot","Curl heels down and back","Squeeze hamstrings at the bottom","Return slowly"],mistakes:["Lifting hips off the seat","Going too fast","Short range"],yt:"seated leg curl form"},
calf_raise:{name:"Standing Calf Raise",img:"Standing_Calf_Raises",equip:"Standing calf raise machine. No calf machine? Do calf presses on the leg press or hold dumbbells on a step.",cues:["Balls of feet on the edge","Rise up as high as you can","Pause 1 sec at the top","Lower to a deep stretch"],mistakes:["Bouncing","Bending the knees","Tiny range of motion"],yt:"standing calf raise machine form"},
dead_bug:{name:"Dead Bug",img:"Dead_Bug",equip:"Mat area.",cues:["Lie on back, arms up, knees at 90°","Press lower back into the floor","Extend opposite arm and leg slowly","Return and switch sides"],mistakes:["Lower back arching off the floor","Moving fast","Holding your breath"],yt:"dead bug exercise form"},
pallof:{name:"Pallof Press",img:"Pallof_Press",equip:"Cable station, handle at chest height. Stand sideways to the stack.",cues:["Stand sideways, feet shoulder-width","Handle at your chest, brace abs","Press straight out, resist the twist","Hold 1 sec, bring back; do both sides"],mistakes:["Letting the cable rotate you","Standing too close (too easy)","Leaning away"],yt:"pallof press form"},

 var rows=last.rows;var allTop=rows.length>=it.sets&&rows.every(function(r){return (+r.r||0)>=it.hi;});
